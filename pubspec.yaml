name: quick_scan_pdf
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.7
  crop_image: ^1.0.13

  go_router: ^17.0.1
  flutter_pdfview: ^1.3.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  pdf: ^3.10.6
  camera: ^0.10.5+5
  get_it: 9.2.0
  google_fonts: ^6.1.0
  path_provider: ^2.1.2
  permission_handler: ^12.0.1
  share_plus: ^7.2.2
  flutter_edge_detection: ^1.0.2
  shared_preferences: ^2.2.2
  image: ^4.1.7  # For image processing/enhancement
  opencv_dart: ^1.0.4  # Advanced image processing

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"


flutter:


  uses-material-design: true

